environment: prd
refresh: 24h0m0s
secrets:
  - name: mariadb-root
    ns: wordpress
    secret: homelab-k8s
    keys:
      - { name: password, key: mariadb-root-password }
  - name: jwt-secrets
    ns: default
    secret: homelab-k8s
    keys:
      - name: jwt-seed
  # MinIO
  - name: minio-root-user
    ns: minio
    secret: homelab-k8s
    keys:
      - { name: rootUser, key: minio-root-user-name }
      - { name: rootPassword, key: minio-root-user-password }
  - name: minio-env
    ns: minio
    secret: homelab-k8s
    keys:
      - name: CONSOLE_PBKDF_PASSPHRASE
        key: minio-console-pbkdf-passphrase
      - name: CONSOLE_PBKDF_SALT
        key: minio-console-pbkdf-salt
  - &minio-user
    ns: minio
    secret: homelab-k8s
    name: minio-user-loki
    keys: [{ name: secret-key, key: minio-user-loki-secret-key }]
  - <<: *minio-user
    name: minio-user-registry
    keys: [{ name: secret-key, key: minio-user-registry-secret-key }]
  - <<: *minio-user
    name: minio-user-backups
    keys: [{ name: secret-key, key: minio-user-backups-secret-key }]
  - <<: *minio-user
    name: minio-user-files
    keys: [{ name: secret-key, key: minio-user-files-secret-key }]
  - <<: *minio-user
    name: minio-user-outline
    keys: [{ name: secret-key, key: minio-user-outline-secret-key }]
  - <<: *minio-user
    name: minio-user-geoipupdate
    keys: [{ name: secret-key, key: minio-user-geoipupdate-secret-key }]
  - <<: *minio-user
    name: minio-user-github-actions
    keys: [{ name: secret-key, key: minio-user-github-actions-secret-key }]
  # - <<: *minio-user
  #   name: minio-user-mastodon
  #   keys: [{ name: secret-key, key: minio-user-mastodon-secret-key }]
  - <<: *minio-user
    name: minio-user-wordpress
    keys: [{ name: secret-key, key: minio-user-wordpress-secret-key }]
  - <<: *minio-user
    name: minio-user-bsky
    keys: [{ name: secret-key, key: minio-user-bsky-secret-key }]

